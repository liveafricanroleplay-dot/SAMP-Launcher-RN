name: Build Afro City RP OneZip APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "SAMP-Mobile-Launcher-AfroCityRP-OneZip.zip"
      - ".github/workflows/afro-city-onezip-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;31.0.0" "ndk;21.4.7075529"

      - name: Extract the exact OneZip source
        run: |
          mkdir -p source
          unzip -q "SAMP-Mobile-Launcher-AfroCityRP-OneZip.zip" -d source
          test -f source/SAMP-Mobile-Launcher-RN-main/package.json
          test -f source/SAMP-Mobile-Launcher-RN-main/yarn.lock
          test -f source/SAMP-Mobile-Launcher-RN-main/.env
          test -f source/SAMP-Mobile-Launcher-RN-main/android/gradlew
          test -f source/SAMP-Mobile-Launcher-RN-main/android/app/google-services.json

      - name: Install JavaScript dependencies
        working-directory: source/SAMP-Mobile-Launcher-RN-main
        run: |
          corepack enable
          yarn install --frozen-lockfile --non-interactive

      - name: Build release APK
        working-directory: source/SAMP-Mobile-Launcher-RN-main/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFRO-CITY-RP-ONEZIP-APK
          path: source/SAMP-Mobile-Launcher-RN-main/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
